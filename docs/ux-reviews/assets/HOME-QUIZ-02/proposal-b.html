<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>디자인 제안 B · 정적 시안</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f8f6ff;
      color: #29243d;
      font-family: Arial, "Apple SD Gothic Neo", sans-serif;
    }
    header {
      background: white;
      border-bottom: 1px solid #e3ddef;
    }
    .wrap {
      max-width: 1220px;
      margin: auto;
      padding: 0 48px;
    }
    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #6544dc;
    }
    .nav span {
      font-size: 14px;
      color: #716a84;
    }
    main {
      padding-top: 40px !important;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      margin: 0;
    }
    select {
      font: inherit;
      font-size: 14px;
      background: white;
      border: 1px solid #e3ddef;
      border-radius: 12px;
      padding: 12px 16px;
      width: 220px;
    }
    .card {
      background: white;
      border: 1px solid #e3ddef;
      border-radius: 20px;
      overflow: hidden;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
    }
    .question {
      padding: 36px;
      border-right: 1px solid #e3ddef;
      background: #f8f6ff80;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      color: #716a84;
    }
    h2 {
      font-size: 26px;
      line-height: 1.55;
      margin: 18px 0 0;
      max-width: 460px;
    }
    .answer {
      padding: 36px;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 16px;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid #e3ddef;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 16px;
      min-height: 56px;
    }
    .option.selected {
      border-color: #6544dc;
      background: #6544dc0d;
    }
    .circle {
      width: 18px;
      height: 18px;
      border: 1px solid #aaa;
      border-radius: 50%;
    }
    .selected .circle {
      border: 5px solid #6544dc;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid #e3ddef;
      padding: 20px 36px;
    }
    button {
      background: #6544dc;
      color: white;
      border: 2px solid #4b30ac;
      border-radius: 13px;
      padding: 12px 24px;
      font-weight: 650;
      font-size: 14px;
      box-shadow: 0 3px 0 #4b30ac;
      min-width: 144px;
    }
    .meta {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #716a84;
    }
    .notice {
      margin-top: 64px;
      font-size: 12px;
      color: #716a84;
    }
    @media (max-width: 767px) {
      .wrap {
        padding: 0 20px;
      }
      .nav span {
        display: none;
      }
      .bar {
        display: block;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 20px;
      }
      select {
        width: 100%;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .question {
        padding: 24px 20px;
        border-right: 0;
        border-bottom: 1px solid #e3ddef;
      }
      h2 {
        font-size: 22px;
        margin-top: 12px;
      }
      .answer {
        padding: 24px 20px;
      }
      .actions {
        padding: 16px 20px;
      }
      button {
        width: 100%;
      }
      .meta {
        display: block;
      }
      .meta span {
        display: block;
        margin-bottom: 20px;
      }
    }
    .grid {
      display: block;
    }
    .question {
      background: transparent;
      border: 0;
      padding: 28px 32px 24px;
    }
    .eyebrow {
      display: inline-block;
      background: #6544dc0a;
      color: #6544dc;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
    }
    h2 {
      font-size: 24px;
      max-width: none;
      margin-top: 16px;
      line-height: 1.5;
    }
    .answer {
      padding: 0 32px 28px;
    }
    h3 {
      font-size: 13px;
      color: #716a84;
      margin-bottom: 12px;
    }
    .option {
      margin-bottom: 10px;
      padding: 15px 16px;
      min-height: 54px;
      background: #f8f6ff55;
    }
    .option.selected {
      background: #6544dc0d;
      border-color: #6544dc;
    }
    .actions {
      padding: 0 32px 28px;
      border: 0;
    }
    button {
      min-width: 144px;
    }
    .bar {
      margin-bottom: 20px;
    }
    .meta {
      margin-top: 16px;
    }
    @media (max-width: 767px) {
      .question {
        padding: 24px 20px 24px;
      }
      h2 {
        font-size: 22px;
        line-height: 1.5;
      }
      .answer {
        padding: 0 20px 24px;
      }
      .actions {
        padding: 0 20px 24px;
      }
      .meta span {
        margin-bottom: 16px;
      }
      .notice {
        margin-top: 40px;
      }
    }
  </style>
  <header>
    <div class="wrap nav">
      <div class="logo">b. bugri</div>
      <span>개발자·태그 탐색　　 Shop</span
      ><span>내 프로필⌄</span>
    </div>
  </header>
  <main class="wrap">
    <div class="bar">
      <h1>오늘의 퀴즈</h1>
      <select aria-label="학습 태그">
        <option>학습 태그 · 전체</option>
      </select>
    </div>
    <article class="card">
      <div class="grid">
        <section class="question">
          <div class="eyebrow">타입 선언</div>
          <h2>TypeScript에서 숫자 타입은?</h2>
        </section>
        <section class="answer">
          <h3>답안 선택</h3>
          <div class="option selected">
            <i class="circle"></i>number
          </div>
          <div class="option">
            <i class="circle"></i>string
          </div>
        </section>
      </div>
      <div class="actions"><button>답 제출</button></div>
    </article>
    <div class="meta">
      <span>▸ 프로토타입 안내</span
      ><span>BugCoin 상점 둘러보기 →</span>
    </div>
    <p class="notice">
      디자인 제안 B · 정적 시안 / 헤더 상세는 비교 대상이
      아니어서 간소화 · 연속 학습 영역은 변경 범위에서
      제외하여 생략
    </p>
  </main>
</html>
